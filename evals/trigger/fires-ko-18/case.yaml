schema_version: "1.1"
name: fires-ko-18
description: "출시 가능 여부(go/no-go)를 실행 근거로 판정해 달라는 요청."
tags: [trigger, fires]
runs: 3
execution:
  prompt: "이거 지금 내보내도 되는 상태야? 직접 돌려보고 판단해줘"
  max_turns: 3
  timeout_seconds: 180
  allowed_tools: [Skill, Read, Glob, Grep]
graders:
  - name: invokes-qa-skill
    type: tool_used
    tool: Skill
    input_match: '"skill":\s*"(sw-qa:)?qa"'
    arm: both
