schema_version: "1.1"
name: fires-ko-08
description: "수정이 실제로 먹혔는지 실행으로 확인해 달라는 요청."
tags: [trigger, fires]
runs: 3
execution:
  prompt: "아까 고친 파일 업로드 버그 진짜 고쳐진 건지 확인해봐"
  max_turns: 3
  timeout_seconds: 180
  allowed_tools: [Skill, Read, Glob, Grep]
graders:
  - name: invokes-qa-skill
    type: tool_used
    tool: Skill
    input_match: '"skill":\s*"(sw-qa:)?qa"'
    arm: both
