schema_version: "1.1"
name: fires-ko-02
description: "새 기능이 실제로 동작하는지 검증해 달라는 요청."
tags: [trigger, fires]
runs: 3
execution:
  prompt: "소셜 로그인 붙였는데 제대로 동작하는지 테스트해줘"
  max_turns: 3
  timeout_seconds: 180
  allowed_tools: [Skill, Read, Glob, Grep]
graders:
  - name: invokes-qa-skill
    type: tool_used
    tool: Skill
    input_match: '"skill":\s*"(sw-qa:)?qa"'
    arm: both
