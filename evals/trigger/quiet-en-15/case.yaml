schema_version: "1.1"
name: quiet-en-15
description: "QA 직군 채용에 대한 질문."
tags: [trigger, quiet]
runs: 3
execution:
  prompt: "what interview questions should I ask a QA engineer candidate?"
  max_turns: 3
  timeout_seconds: 180
  allowed_tools: [Skill, Read, Glob, Grep]
graders:
  - name: leaves-qa-skill-alone
    type: tool_used
    tool: Skill
    input_match: '"skill":\s*"(sw-qa:)?qa"'
    min: 0
    max: 0
    arm: both
