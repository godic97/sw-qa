schema_version: "1.1"
name: quiet-ko-04
description: "코드를 읽고 의견을 달라는 요청. 실행 기반 검증이 아님."
tags: [trigger, quiet]
runs: 3
execution:
  prompt: "이 PR 코드 리뷰해줘. 테스트 코드 쪽도 같이"
  max_turns: 3
  timeout_seconds: 180
  allowed_tools: [Skill, Read, Glob, Grep]
graders:
  - name: leaves-qa-skill-alone
    type: tool_used
    tool: Skill
    input_match: '"skill":\s*"(sw-qa:)?qa"'
    min: 0
    max: 0
    arm: both
