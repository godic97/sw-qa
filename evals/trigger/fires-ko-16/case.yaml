schema_version: "1.1"
name: fires-ko-16
description: "테스트 코드 작성이 아니라 테스트 케이스 설계 요청."
tags: [trigger, fires]
runs: 3
execution:
  prompt: "쿠폰 중복 적용 로직 테스트 케이스 설계해줘. 경계값도 포함해서"
  max_turns: 3
  timeout_seconds: 180
  allowed_tools: [Skill, Read, Glob, Grep]
graders:
  - name: invokes-qa-skill
    type: tool_used
    tool: Skill
    input_match: '"skill":\s*"(sw-qa:)?qa"'
    arm: both
