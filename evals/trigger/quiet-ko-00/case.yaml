schema_version: "1.1"
name: quiet-ko-00
description: "테스트 코드를 작성해 달라는 요청. 동작 검증·판정이 아님."
tags: [trigger, quiet]
runs: 3
execution:
  prompt: "utils/date.ts 유닛 테스트 짜줘"
  max_turns: 3
  timeout_seconds: 180
  allowed_tools: [Skill, Read, Glob, Grep]
graders:
  - name: leaves-qa-skill-alone
    type: tool_used
    tool: Skill
    input_match: '"skill":\s*"(sw-qa:)?qa"'
    min: 0
    max: 0
    arm: both
