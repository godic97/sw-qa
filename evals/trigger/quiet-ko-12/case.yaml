schema_version: "1.1"
name: quiet-ko-12
description: "테스트 코드 구조를 고치는 작업."
tags: [trigger, quiet]
runs: 3
execution:
  prompt: "테스트 코드에 setup 중복이 너무 많아. fixture로 묶어서 리팩토링해줘"
  max_turns: 3
  timeout_seconds: 180
  allowed_tools: [Skill, Read, Glob, Grep]
graders:
  - name: leaves-qa-skill-alone
    type: tool_used
    tool: Skill
    input_match: '"skill":\s*"(sw-qa:)?qa"'
    min: 0
    max: 0
    arm: both
