schema_version: "1.1"
name: fires-en-19
description: "PR 대상 QA와 결함 목록 보고 요청."
tags: [trigger, fires]
runs: 3
execution:
  prompt: "give PR #482 a proper QA pass and list any defects you find"
  max_turns: 3
  timeout_seconds: 180
  allowed_tools: [Skill, Read, Glob, Grep]
graders:
  - name: invokes-qa-skill
    type: tool_used
    tool: Skill
    input_match: '"skill":\s*"(sw-qa:)?qa"'
    arm: both
