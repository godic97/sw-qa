schema_version: "1.1"
name: quiet-en-05
description: "코드 품질에 대한 리뷰 요청. 동작 검증이 아님."
tags: [trigger, quiet]
runs: 3
execution:
  prompt: "review my diff, mostly want feedback on naming and structure. tests included"
  max_turns: 3
  timeout_seconds: 180
  allowed_tools: [Skill, Read, Glob, Grep]
graders:
  - name: leaves-qa-skill-alone
    type: tool_used
    tool: Skill
    input_match: '"skill":\s*"(sw-qa:)?qa"'
    min: 0
    max: 0
    arm: both
