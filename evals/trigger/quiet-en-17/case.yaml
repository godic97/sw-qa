schema_version: "1.1"
name: quiet-en-17
description: "'regression'이 들어가지만 테스트 코드를 추가해 달라는 요청."
tags: [trigger, quiet]
runs: 3
execution:
  prompt: "add a regression test for the null-avatar crash we just fixed"
  max_turns: 3
  timeout_seconds: 180
  allowed_tools: [Skill, Read, Glob, Grep]
graders:
  - name: leaves-qa-skill-alone
    type: tool_used
    tool: Skill
    input_match: '"skill":\s*"(sw-qa:)?qa"'
    min: 0
    max: 0
    arm: both
