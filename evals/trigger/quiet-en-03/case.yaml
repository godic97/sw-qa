schema_version: "1.1"
name: quiet-en-03
description: "불안정한 테스트를 고쳐 달라는 요청. 원인 추적과 코드 수정이 본질."
tags: [trigger, quiet]
runs: 3
execution:
  prompt: "fix the flaky test in test_scheduler.py, it times out about 1 in 10 runs"
  max_turns: 3
  timeout_seconds: 180
  allowed_tools: [Skill, Read, Glob, Grep]
graders:
  - name: leaves-qa-skill-alone
    type: tool_used
    tool: Skill
    input_match: '"skill":\s*"(sw-qa:)?qa"'
    min: 0
    max: 0
    arm: both
