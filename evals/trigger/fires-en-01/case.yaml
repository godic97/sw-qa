schema_version: "1.1"
name: fires-en-01
description: "기능을 지목한 출시 전 QA 요청."
tags: [trigger, fires]
runs: 3
execution:
  prompt: "can you QA the checkout flow before we ship?"
  max_turns: 3
  timeout_seconds: 180
  allowed_tools: [Skill, Read, Glob, Grep]
graders:
  - name: invokes-qa-skill
    type: tool_used
    tool: Skill
    input_match: '"skill":\s*"(sw-qa:)?qa"'
    arm: both
