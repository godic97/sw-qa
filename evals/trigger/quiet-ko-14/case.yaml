schema_version: "1.1"
name: quiet-ko-14
description: "QA 직무·커리어에 대한 질문."
tags: [trigger, quiet]
runs: 3
execution:
  prompt: "개발하다가 QA 엔지니어로 전향하면 커리어상 어때?"
  max_turns: 3
  timeout_seconds: 180
  allowed_tools: [Skill, Read, Glob, Grep]
graders:
  - name: leaves-qa-skill-alone
    type: tool_used
    tool: Skill
    input_match: '"skill":\s*"(sw-qa:)?qa"'
    min: 0
    max: 0
    arm: both
