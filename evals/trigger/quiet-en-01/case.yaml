schema_version: "1.1"
name: quiet-en-01
description: "테스트 코드 작성 요청."
tags: [trigger, quiet]
runs: 3
execution:
  prompt: "write unit tests for the retry helper in http_client.py"
  max_turns: 3
  timeout_seconds: 180
  allowed_tools: [Skill, Read, Glob, Grep]
graders:
  - name: leaves-qa-skill-alone
    type: tool_used
    tool: Skill
    input_match: '"skill":\s*"(sw-qa:)?qa"'
    min: 0
    max: 0
    arm: both
