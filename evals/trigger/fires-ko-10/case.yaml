schema_version: "1.1"
name: fires-ko-10
description: "변경 후 회귀 확인 요청."
tags: [trigger, fires]
runs: 3
execution:
  prompt: "결제 모듈 리팩토링했는데 기존 동작 안 깨졌는지 회귀 테스트 해줘"
  max_turns: 3
  timeout_seconds: 180
  allowed_tools: [Skill, Read, Glob, Grep]
graders:
  - name: invokes-qa-skill
    type: tool_used
    tool: Skill
    input_match: '"skill":\s*"(sw-qa:)?qa"'
    arm: both
