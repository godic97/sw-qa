schema_version: "1.1"
name: fires-ko-12
description: "기능에 대한 테스트 시나리오 설계 요청(케이스 설계 단계)."
tags: [trigger, fires]
runs: 3
execution:
  prompt: "알림 설정 기능 테스트 시나리오 뽑아줘"
  max_turns: 3
  timeout_seconds: 180
  allowed_tools: [Skill, Read, Glob, Grep]
graders:
  - name: invokes-qa-skill
    type: tool_used
    tool: Skill
    input_match: '"skill":\s*"(sw-qa:)?qa"'
    arm: both
