schema_version: "1.1"
name: quiet-en-09
description: "테스트 개념에 대한 질문."
tags: [trigger, quiet]
runs: 3
execution:
  prompt: "what's the difference between smoke testing and regression testing?"
  max_turns: 3
  timeout_seconds: 180
  allowed_tools: [Skill, Read, Glob, Grep]
graders:
  - name: leaves-qa-skill-alone
    type: tool_used
    tool: Skill
    input_match: '"skill":\s*"(sw-qa:)?qa"'
    min: 0
    max: 0
    arm: both
