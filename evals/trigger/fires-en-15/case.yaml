schema_version: "1.1"
name: fires-en-15
description: "파일 변경 후 기존 동작이 유지되는지 확인하는 회귀 검증. 'QA'·'test' 단어 없음."
tags: [trigger, fires]
runs: 3
execution:
  prompt: "I changed parser.py, make sure existing configs still load the same way"
  max_turns: 3
  timeout_seconds: 180
  allowed_tools: [Skill, Read, Glob, Grep]
graders:
  - name: invokes-qa-skill
    type: tool_used
    tool: Skill
    input_match: '"skill":\s*"(sw-qa:)?qa"'
    arm: both
