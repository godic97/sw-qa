schema_version: "1.1"
name: fires-en-03
description: "새 기능의 end-to-end 동작 검증 요청."
tags: [trigger, fires]
runs: 3
execution:
  prompt: "test that the new CSV export actually works end to end"
  max_turns: 3
  timeout_seconds: 180
  allowed_tools: [Skill, Read, Glob, Grep]
graders:
  - name: invokes-qa-skill
    type: tool_used
    tool: Skill
    input_match: '"skill":\s*"(sw-qa:)?qa"'
    arm: both
