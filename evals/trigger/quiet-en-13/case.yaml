schema_version: "1.1"
name: quiet-en-13
description: "CI 설정을 추가하는 작업."
tags: [trigger, quiet]
runs: 3
execution:
  prompt: "add a GitHub Actions job that runs the test suite on every push"
  max_turns: 3
  timeout_seconds: 180
  allowed_tools: [Skill, Read, Glob, Grep]
graders:
  - name: leaves-qa-skill-alone
    type: tool_used
    tool: Skill
    input_match: '"skill":\s*"(sw-qa:)?qa"'
    min: 0
    max: 0
    arm: both
