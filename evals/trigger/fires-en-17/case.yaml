schema_version: "1.1"
name: fires-en-17
description: "문서(README)를 기준으로 실제 동작을 검증해 달라는 요청."
tags: [trigger, fires]
runs: 3
execution:
  prompt: "smoke test the CLI, make sure every subcommand does what the README claims"
  max_turns: 3
  timeout_seconds: 180
  allowed_tools: [Skill, Read, Glob, Grep]
graders:
  - name: invokes-qa-skill
    type: tool_used
    tool: Skill
    input_match: '"skill":\s*"(sw-qa:)?qa"'
    arm: both
