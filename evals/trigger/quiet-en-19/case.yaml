schema_version: "1.1"
name: quiet-en-19
description: "'test'가 실험(A/B)을 뜻함. 소프트웨어 동작 검증이 아님."
tags: [trigger, quiet]
runs: 3
execution:
  prompt: "is this A/B test result statistically significant? numbers are in results.csv"
  max_turns: 3
  timeout_seconds: 180
  allowed_tools: [Skill, Read, Glob, Grep]
graders:
  - name: leaves-qa-skill-alone
    type: tool_used
    tool: Skill
    input_match: '"skill":\s*"(sw-qa:)?qa"'
    min: 0
    max: 0
    arm: both
